# XcodeGen spec for the MOZU Scanner iOS app and its App Clip.
# Generates MozuScanner.xcodeproj with every Swift source compiled and the
# Textures + Models bundled as loose resources (the way the code loads them).
#
#   brew install xcodegen
#   cd apps/ios
#   xcodegen generate
#   open MozuScanner.xcodeproj
#
# Then set your signing Team in the target's Signing & Capabilities and run on
# an iPad (a LiDAR iPad Pro is required only for the RoomPlan scan step).
#
# Two targets share one source tree:
#   MozuScanner      the full app: scan → floorplan → send, plus the 3D design room
#   MozuScannerClip  the App Clip: scan → floorplan → send only (no Design/, no
#                    USDZ models or HDR, so it stays under Apple's clip size limit).
#                    Compiled with the APPCLIP flag; see apps/ios/README.md.
# Signing an App Clip needs a paid Apple Developer team (App Clips and
# Associated Domains aren't available to a free Personal Team). Both targets
# still compile with CODE_SIGNING_ALLOWED=NO.

name: MozuScanner
options:
  bundleIdPrefix: com.mozu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    TARGETED_DEVICE_FAMILY: "1,2"        # iPhone + iPad
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer team here (or in the Xcode UI):
    DEVELOPMENT_TEAM: ""

targets:
  MozuScanner:
    type: application
    platform: iOS
    sources:
      # All Swift sources (skip docs); Resources added separately as a resource phase.
      - path: MozuScanner
        excludes:
          - "**/*.md"
          - "Info.plist"
          - "Resources/**"
      - path: MozuScanner/Resources
        buildPhase: resources
        excludes:
          - "Studio.skybox"
          - "Studio.skybox/**"
      # The .skybox folder must be a SINGLE file reference (not recursed into) so
      # Xcode's RealityKit environment build rule compiles it to a .realityenv that
      # `EnvironmentResource.load(named: "Studio")` can read for image-based lighting.
      - path: MozuScanner/Resources/Studio.skybox
        type: file
        buildPhase: resources
      # App icon for the full app (placeholder artwork; replace before App Store submission).
      - path: Shared/Assets.xcassets
    dependencies:
      # Embeds the clip in the app bundle (AppClips/MozuScannerClip.app).
      - target: MozuScannerClip
    entitlements:
      path: MozuScanner/MozuScanner.entitlements
      properties:
        com.apple.developer.associated-appclip-app-identifiers:
          - $(AppIdentifierPrefix)com.averyhsu.roommuse.Clip
        # Shared container: the clip leaves the last scan code here for the full app.
        com.apple.security.application-groups:
          - group.com.averyhsu.roommuse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.averyhsu.roommuse
        INFOPLIST_FILE: MozuScanner/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # RealityKit / ARKit / RoomPlan are system frameworks; auto-linked from imports.

  MozuScannerClip:
    type: application.on-demand-install-capable
    platform: iOS
    sources:
      # The scan path, shared with the full app. Nothing here loads bundle resources.
      - MozuScanner/Models
      - MozuScanner/Scan
      - MozuScanner/Floorplan
      - MozuScanner/Export/Handoff.swift
      - MozuScanner/Export/ClipInvocation.swift
      - MozuScanner/Views
      # Clip-only: entry point, Info.plist, icon.
      - path: MozuScannerClip
        excludes:
          - "Info.plist"
          - "**/*.md"
    entitlements:
      path: MozuScannerClip/MozuScannerClip.entitlements
      properties:
        com.apple.developer.on-demand-install-capable: true
        com.apple.developer.parent-application-identifiers:
          - $(AppIdentifierPrefix)com.averyhsu.roommuse
        # The domain that serves /.well-known/apple-app-site-association (see
        # apps/web/.well-known). Change this if the site moves to a custom domain.
        com.apple.developer.associated-domains:
          - appclips:roommuse-design.vercel.app
        com.apple.security.application-groups:
          - group.com.averyhsu.roommuse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.averyhsu.roommuse.Clip
        INFOPLIST_FILE: MozuScannerClip/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) APPCLIP
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES

schemes:
  MozuScanner:
    build:
      targets:
        MozuScanner: all
    run:
      config: Debug
      # iPadOS 26's RealityKit has a bug where RoomCaptureView's AR passthrough binds
      # a 2D texture where its `tonemapLUT` shader now expects a 1D one. It's harmless
      # at runtime, but Metal API Validation (ON by default for debug Run from Xcode)
      # turns it into a hard abort on the render thread the moment scanning starts.
      # Turning validation off for Run lets on-device scanning work. Release /
      # TestFlight / App Store builds never enable validation, so this is debug-only.
      enableGPUValidationMode: false
      enableGPUFrameCaptureMode: disabled
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  MozuScannerClip:
    build:
      targets:
        MozuScannerClip: all
    run:
      config: Debug
      # Same RoomCaptureView / Metal validation workaround as the app scheme.
      enableGPUValidationMode: false
      enableGPUFrameCaptureMode: disabled
      # Xcode passes this to the clip as its invocation URL when run from Xcode,
      # so the session parsing can be exercised without a QR code.
      environmentVariables:
        _XCAppClipURL: https://roommuse-design.vercel.app/clip?s=DEVTEST0
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
